name: Vercel preview

# Publishes a clickable preview URL for every branch push and comments it on the
# open pull request. The job is skipped until the three Vercel secrets exist, so
# the workflow is safe to merge before the project is connected.
on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy preview
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Acquisition Command Center preview"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          pr="$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number')"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "Preview for \`${GITHUB_SHA:0:7}\`: $URL"
          fi
